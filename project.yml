# Fallback only: Waytrace.xcodeproj is included and should open directly.
# If it doesn't, install XcodeGen (brew install xcodegen), delete Waytrace.xcodeproj,
# and run `xcodegen` in this folder to regenerate it.
name: Waytrace
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  RoadKit:
    path: RoadKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Waytrace:
    type: application
    platform: iOS
    sources:
      - path: Waytrace
        excludes:
          - Info.plist
    dependencies:
      - package: RoadKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.waytrace
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Waytrace/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
