name: Build Waytrace (.ipa)

# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Change this to something unique to you BEFORE your first install
  # (e.g. com.yourname.waytrace), then never change it again: a different ID
  # installs as a separate app, and your recordings won't carry over.
  BUNDLE_ID: com.kkessinger131.waytrace

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # The road engine (RoadKit: the Swift port of road_to_kml.py) has its own test
      # suite, a port of test_road_to_kml.py. It runs offline on the Mac runner.
      - name: Test RoadKit
        working-directory: RoadKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../roadkit-test.log

      # Only the app gets BUNDLE_ID. (Passing it to xcodebuild on the command line
      # would give it to the GEOS framework inside the app too, and iOS refuses to
      # install an app whose framework has the app's own ID.)
      - name: Set bundle ID
        run: |
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.example.waytrace;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/" Waytrace.xcodeproj/project.pbxproj
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" Waytrace.xcodeproj/project.pbxproj

      # Builds for a real iPhone without signing. Sideloadly signs it with your
      # Apple ID when it installs, so no certificates are needed here.
      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Waytrace.xcodeproj \
            -scheme Waytrace \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package Waytrace.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Waytrace.app Payload/
          # Every bundle inside the app needs its own ID, or iOS won't install it.
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' Payload/Waytrace.app/Info.plist)
          echo "Waytrace.app: $APP_ID"
          for f in Payload/Waytrace.app/Frameworks/*.framework; do
            [ -e "$f" ] || continue
            ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$f/Info.plist")
            echo "$(basename "$f"): $ID"
            if [ "$ID" = "$APP_ID" ]; then echo "::error::$(basename "$f") has the app's bundle ID"; exit 1; fi
          done
          zip -qry Waytrace.ipa Payload
          ls -lh Waytrace.ipa

      - name: Upload Waytrace.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Waytrace-ipa
          path: Waytrace.ipa
          if-no-files-found: error

      # If the build or tests fail, the logs are saved as a downloadable file.
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            roadkit-test.log
          if-no-files-found: ignore
